# dstarlite.yaml - DStarLitePathSearch 参数定义
#
# 栅格步长（step size）不在这里定义。
# 它是地图的属性，由 IMapView::getStepSize() 在规划时提供。
# 网格维度同样由 DStarLitePathSearch::IMapView 的 rows()/cols()/layers() 提供。
dstarlite_planner:
  connectivity:
    type: string
    default_value: "8"
    description: "Grid connectivity: 4/8 for 2-D, 6/18/26 for 3-D"
    validation:
      one_of<>: [[ "4", "8", "6", "18", "26" ]]
  heuristic:
    type: string
    default_value: "Diagonal"
    description: "Heuristic function: Euclidean | Manhattan | Chebyshev | Diagonal"
    validation:
      one_of<>: [[ "Euclidean", "Manhattan", "Chebyshev", "Diagonal" ]]
  goal_tolerance:
    type: double
    default_value: 0.5
    description: "Acceptable distance to goal in metres"
  max_expansions:
    type: int
    default_value: 1000000
    description: "Maximum number of nodes expanded before giving up (-1 = unlimited)"
  max_path_steps:
    type: int
    default_value: 10000
    description: "Maximum number of steps in the extracted path (-1 = unlimited)"
  max_planning_time:
    type: double
    default_value: 5.0
    description: "Maximum planning wall-clock time in seconds (0.0 = unlimited)"
  movement_weight:
    type: double
    default_value: 1.0
    description: "Weight for the movement cost vs map terrain cost. Higher values make the planner prefer lower-cost terrain."
  greedy_weight:
    type: double
    default_value: 1.0
    description: "Weight for the heuristic in the D* Lite key. 1.0 = optimal; >1.0 = faster but may produce suboptimal paths (bounded by this factor)."
  terrain_weight:
    type: double
    default_value: 1.0
    description: "Multiplier for map terrain cost (edge = step * (movement_weight + terrain_weight * cost)). Rule of thumb: terrain_weight * max_traversable_cost ~= 2 * movement_weight. Recommended: normalized cost 0-1 -> 1.3~3.5 (2.0 typical); OccupancyGrid 0-100 -> ~0.02; Nav2 costmap 0-252 -> ~0.008. Lethal cells (e.g. Nav2 253-255) must be blocked via IMapView::isWalkable(), not by raising this weight."
